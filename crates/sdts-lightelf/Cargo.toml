[package]
name = "sdts-lightelf"
version = "0.1.0"
edition = "2021"
description = "Standalone BLE controller for the LightElf/TD5322A_ laser device, reverse-engineered from the official com.canwin.lightelf app. Not yet wired into SDTP."

[[bin]]
name = "sdts-lightelf"
path = "src/main.rs"

[dependencies]
btleplug = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
uuid = "1"
futures-util = "0.3"
rand = "0.8"
