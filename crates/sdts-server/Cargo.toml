[package]
name = "sdts-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sdts-server"
path = "src/main.rs"

[dependencies]
sdts-engine = { path = "../sdts-engine" }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }
tower-http = { version = "0.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
